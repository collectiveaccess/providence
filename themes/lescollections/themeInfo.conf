# Thème « lescollections » — Providence pour lescollections.fr
#
# POURQUOI CE THÈME EXISTE
# Il ne porte AUCUNE charte graphique : il n'a ni CSS propre, ni image, ni gabarit de
# mise en page. Il n'existe que pour corriger, sans jamais modifier le thème « default »
# de l'amont, les quelques endroits où le HTML servi n'est pas conforme à ce que nous
# voulons livrer (DOCTYPE, langue déclarée). Patcher « default » directement rendrait
# chaque montée de version de Providence conflictuelle ; un thème séparé garde la
# capacité de suivre l'amont.
#
# TOUT LE RESTE VIENT DE « default », PAR REPLI AUTOMATIQUE, ET SANS AUCUNE DÉCLARATION
# À FAIRE ICI : `View::setViewPath()` empile inconditionnellement
# `themes/default/views/<suffixe>` sous le chemin du thème courant, et
# `RequestHTTP::getUrlPathForThemeFile()` / `caGetThemeGraphic()` cherchent le fichier
# dans le thème courant puis dans « default ». Le thème ne contient donc QUE les
# fichiers qui diffèrent.
#
# ⚠️ Il n'y a volontairement PAS de clé `inheritFrom` dans conf/app.conf : elle sert à
# hériter d'un thème AUTRE que « default ». Le repli sur « default » est déjà
# inconditionnel ; la déclarer ne changerait rien et laisserait croire que c'est elle
# qui fait le travail.
#
# ── LA DETTE, ET COMMENT ON LA PAIE ────────────────────────────────────────────────
# Deux gabarits sont COPIÉS depuis « default » (views/system/login_html.php et
# views/pageFormat/pageHeader.php). Une copie ne bénéficie pas des corrections de
# l'amont. À CHAQUE montée de version de Providence, il faut donc rejouer le diff :
#
#   # 1. Ce que l'amont a changé dans les deux gabarits depuis le tag qu'on quitte :
#   git log --oneline <ancien-tag>..<nouveau-tag> -- \
#       themes/default/views/system/login_html.php \
#       themes/default/views/pageFormat/pageHeader.php
#
#   # 2. Ce que NOUS avons changé, à reporter sur la nouvelle version de l'amont
#   #    (doit rester deux lignes par fichier, plus les commentaires) :
#   for f in views/system/login_html.php views/pageFormat/pageHeader.php; do
#       diff -u "themes/default/$f" "themes/lescollections/$f"
#   done
#
# Si l'étape 1 ne rend rien, il n'y a rien à faire. Si elle rend quelque chose, repartir
# du fichier de l'amont et y réappliquer les deux lignes de l'étape 2 — dans ce sens, et
# pas l'inverse.

code = lescollections
name = lescollections.fr
description = Thème de lescollections.fr — correctifs HTML sur le thème default, sans charte propre
