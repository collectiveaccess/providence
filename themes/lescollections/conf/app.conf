# Surcharge de configuration propre au thème « lescollections ».
# UN SEUL RÉGLAGE, et sans lui le thème serait à moitié inactif.
#
# ── ⚠️ LE PIÈGE : DANS PROVIDENCE, UN THÈME NE S'APPLIQUE PAS AUX PAGES CONNECTÉES ──
#
# `RequestHTTP::getThemeDirectoryPath()` (app/lib/Controller/Request/RequestHTTP.php)
# ne lit PAS le thème de l'installation quand un utilisateur est authentifié :
#
#     if (!$pb_use_default && $this->isLoggedIn()) {
#         $vs_theme = $this->user->getPreference('ui_theme');
#     } else {
#         $vs_theme = $this->config->get('theme');
#     }
#
# et la valeur par défaut de cette préférence est la chaîne littérale « default »
# (app/conf/user_pref_defs.conf : `ui_theme = { … default = default }`).
#
# Conséquence, contre-intuitive et silencieuse : sans le réglage ci-dessous, notre thème
# ne serait utilisé QUE sur les pages vues avant connexion (l'écran d'identification) et
# jamais dans l'éditeur. Aucun message, aucune erreur — simplement un correctif qui ne
# s'applique pas là où on croit l'avoir appliqué.
#
# ── LA CORRECTION, ET SON NOM TROMPEUR ─────────────────────────────────────────────
#
# `always_use_default_theme` ne veut pas dire « toujours utiliser le thème *default* »
# mais « toujours utiliser le thème PAR DÉFAUT DE L'INSTALLATION, quelle que soit la
# préférence de l'utilisateur » — c'est-à-dire, ici, `lescollections`. Le commentaire de
# app/conf/global.conf le dit ainsi : « the theme specified above is *always* used no
# matter the user's preference ».
#
# C'est le comportement voulu pour un service en ligne mutualisé : le HTML servi est
# notre responsabilité, il n'a pas à dépendre d'une case cochée par un utilisateur. La
# contrepartie est assumée : la préférence « thème de l'interface » n'a plus d'effet.
#
# ── POURQUOI ICI ET PAS DANS app/conf/global.conf ─────────────────────────────────
#
# Parce que la clé y est déjà, à 0, et que la modifier serait une retouche de l'amont —
# exactement ce que ce thème existe pour éviter. Et parce que ce fichier-ci fonctionne :
# `Configuration::__construct()` charge d'abord TOUS les global.conf (dont celui de
# l'amont), PUIS la chaîne des app.conf en ordre inverse — la surcharge de thème passe
# donc après. ⚠️ L'inverse n'est pas vrai : un `global.conf` déposé dans un thème ou
# dans app/conf/local/ serait ÉCRASÉ par celui de l'amont, chargé en dernier. C'est un
# quart d'heure de perdu si on l'apprend en le testant.

always_use_default_theme = 1

# ── ⚠️ ET IL EN FAUT UN SECOND : DÉFINIR __CA_THEME__ DANS setup.php NE SUFFIT PAS ──
#
# `app/conf/global.conf` annonce « theme = __CA_THEME__ » avec ce commentaire :
# « Theme to use as default (by convention set to the __CA_THEME__ constant defined in
# setup.php) ». C'est FAUX dans Providence 2.0.11, et de façon invisible :
# `app/conf/app.conf` (ligne 1758) contient plus loin un littéral
#
#     theme = default
#
# et `Configuration::__construct()` charge TOUS les global.conf AVANT la chaîne des
# app.conf. Le littéral de l'amont gagne donc systématiquement. Résultat mesuré sur un
# pod réel, avant cette ligne-ci : `__CA_THEME__` valait bien « lescollections »,
# `__CA_THEME_URL__` pointait bien sur notre thème (la feuille de style était demandée au
# bon endroit)… mais `$request->config->get('theme')` rendait « default », donc
# `getViewsDirectoryPath()` rendait themes/default/views et les GABARITS servis étaient
# ceux de l'amont. Symptôme trompeur au possible : le thème avait l'air actif, et il ne
# l'était qu'à moitié.
#
# On rétablit donc ici le lien que global.conf prétendait faire. `__CA_THEME__` est
# substituée par `Configuration::_trimScalar()`, qui remplace tout `__CONSTANTE__` en
# début de valeur — l'écrire ainsi plutôt qu'en dur garde ce fichier valable quel que
# soit le nom du thème, et fait que le retour arrière par `POD_THEME=default` reste
# cohérent (ce fichier n'est alors même plus chargé, le thème de conf étant
# themes/<__CA_THEME__>/conf).
theme = __CA_THEME__

# ⚠️ CE QU'ON NE SURCHARGE VOLONTAIREMENT PAS : `views_directory`.
# `app/conf/app.conf` le définit par « <themes_directory>/<theme>/views », mais
# l'interpolation des `<clé>` a lieu à la FIN DU CHARGEMENT DE CHAQUE FICHIER : la valeur
# est donc déjà figée sur themes/default/views quand notre surcharge de `theme` est lue.
# C'est tentant de la corriger ici — il ne faut pas. `ConfigurationCheck` fait
# `require_once(config->get('views_directory')."/system/configuration_error_html.php")`,
# SANS repli sur le thème « default ». La pointer sur un thème qui ne contient pas ce
# fichier remplacerait une page d'erreur lisible par une erreur fatale de PHP, exactement
# le jour où quelque chose va mal. Les rares consommateurs de cette clé (AppNavigation,
# AjaxFooter, ConfigurationCheck) restent donc sur « default », et leurs vues passent de
# toute façon par `View`, dont le repli sur « default » est inconditionnel.
